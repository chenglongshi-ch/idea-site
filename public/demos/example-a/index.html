<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>番茄钟 · 待办清单</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #1a1a2e;
  --card: #16213e;
  --accent: #e94560;
  --accent2: #0f3460;
  --text: #eee;
  --muted: #8892a4;
  --success: #53d769;
  --radius: 16px;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}

.app {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 28px;
  max-width: 820px;
  width: 100%;
}

h1 {
  grid-column: 1 / -1;
  text-align: center;
  font-size: 1.6rem;
  font-weight: 700;
  letter-spacing: .5px;
  color: var(--text);
  margin-bottom: 4px;
}
h1 span { color: var(--accent); }

.card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 32px;
  box-shadow: 0 8px 32px rgba(0,0,0,.35);
}

/* ── Pomodoro ── */
.timer-wrap { display: flex; flex-direction: column; align-items: center; gap: 20px; }

.ring-container { position: relative; width: 220px; height: 220px; }

.ring-container svg { transform: rotate(-90deg); width: 220px; height: 220px; }

.track { fill: none; stroke: var(--accent2); stroke-width: 8; }
.progress {
  fill: none;
  stroke: var(--accent);
  stroke-width: 8;
  stroke-linecap: round;
  transition: stroke-dashoffset .4s ease;
}

.time-display {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 3.4rem;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  letter-spacing: 2px;
}

.mode-label {
  font-size: .85rem;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 2px;
  margin-bottom: -8px;
}

.btn-row { display: flex; gap: 12px; }

button {
  background: var(--accent2);
  color: var(--text);
  border: none;
  border-radius: 10px;
  padding: 12px 28px;
  font-size: .95rem;
  font-weight: 600;
  cursor: pointer;
  transition: background .2s, transform .1s;
}
button:hover { background: #1a4a8a; }
button:active { transform: scale(.96); }

.btn-primary {
  background: var(--accent);
  min-width: 120px;
}
.btn-primary:hover { background: #c73552; }

.session-dots {
  display: flex;
  gap: 8px;
  margin-top: 4px;
}
.dot {
  width: 10px; height: 10px;
  border-radius: 50%;
  background: var(--accent2);
  transition: background .3s;
}
.dot.filled { background: var(--accent); }

/* ── Todo ── */
.todo-header {
  font-size: 1.15rem;
  font-weight: 700;
  margin-bottom: 18px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.todo-header::before {
  content: '';
  width: 4px; height: 20px;
  background: var(--accent);
  border-radius: 2px;
  display: inline-block;
}

.input-row {
  display: flex;
  gap: 8px;
  margin-bottom: 18px;
}
.input-row input {
  flex: 1;
  background: var(--bg);
  border: 1px solid #2a2a4a;
  border-radius: 10px;
  padding: 11px 14px;
  color: var(--text);
  font-size: .92rem;
  outline: none;
  transition: border-color .2s;
}
.input-row input:focus { border-color: var(--accent); }
.input-row input::placeholder { color: var(--muted); }
.input-row button { padding: 11px 18px; border-radius: 10px; }

.list { list-style: none; max-height: 380px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
.list::-webkit-scrollbar { width: 4px; }
.list::-webkit-scrollbar-thumb { background: var(--accent2); border-radius: 2px; }

.list li {
  display: flex;
  align-items: center;
  gap: 12px;
  background: var(--bg);
  padding: 12px 14px;
  border-radius: 10px;
  animation: fadeIn .25s ease;
}
@keyframes fadeIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }

.checkbox {
  appearance: none;
  width: 20px; height: 20px;
  border: 2px solid var(--muted);
  border-radius: 6px;
  cursor: pointer;
  flex-shrink: 0;
  position: relative;
  transition: background .2s, border-color .2s;
}
.checkbox:checked {
  background: var(--success);
  border-color: var(--success);
}
.checkbox:checked::after {
  content: '';
  position: absolute;
  left: 5px; top: 2px;
  width: 5px; height: 9px;
  border: 2px solid #fff;
  border-top: none; border-left: none;
  transform: rotate(45deg);
}

.task-text {
  flex: 1;
  font-size: .92rem;
  transition: color .3s, text-decoration .3s;
  word-break: break-word;
}
.done + .task-text {
  text-decoration: line-through;
  color: var(--muted);
}

.del-btn {
  background: none;
  border: none;
  color: var(--muted);
  font-size: 1.1rem;
  cursor: pointer;
  padding: 2px 6px;
  border-radius: 6px;
  transition: color .2s, background .2s;
  flex-shrink: 0;
}
.del-btn:hover { color: var(--accent); background: rgba(233,69,96,.12); }

.empty-state {
  color: var(--muted);
  font-size: .88rem;
  text-align: center;
  padding: 32px 0;
}

/* ── Responsive ── */
@media (max-width: 640px) {
  .app { grid-template-columns: 1fr; }
  .ring-container { width: 180px; height: 180px; }
  .ring-container svg { width: 180px; height: 180px; }
  .time-display { font-size: 2.6rem; }
}
</style>
</head>
<body>

<div class="app">
  <h1>🍅 <span>番茄钟</span> · 待办清单</h1>

  <!-- Timer Card -->
  <div class="card timer-wrap">
    <div class="mode-label" id="modeLabel">专注时间</div>
    <div class="ring-container">
      <svg viewBox="0 0 220 220">
        <circle class="track" cx="110" cy="110" r="96"/>
        <circle class="progress" id="progress" cx="110" cy="110" r="96"
          stroke-dasharray="603.2" stroke-dashoffset="0"/>
      </svg>
      <div class="time-display" id="timeDisplay">25:00</div>
    </div>
    <div class="session-dots" id="dots">
      <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
    </div>
    <div class="btn-row">
      <button class="btn-primary" id="mainBtn">开始</button>
      <button id="resetBtn">重置</button>
    </div>
    <div class="btn-row">
      <button id="modeBtn" style="font-size:.82rem;padding:8px 16px;background:#0f3460;">切换模式</button>
    </div>
  </div>

  <!-- Todo Card -->
  <div class="card">
    <div class="todo-header">今日待办</div>
    <div class="input-row">
      <input type="text" id="todoInput" placeholder="添加新任务…" maxlength="100" />
      <button id="addBtn">添加</button>
    </div>
    <ul class="list" id="todoList"></ul>
    <div class="empty-state" id="emptyState">还没有任务，添加一个吧 ✨</div>
  </div>
</div>

<script>
/* ── Pomodoro ── */
const CIRCUMFERENCE = 2 * Math.PI * 96; // ≈ 603.2
const FOCUS = 25 * 60;
const BREAK_SHORT = 5 * 60;
const BREAK_LONG = 15 * 60;
const MODES = [
  { label: '专注时间', duration: FOCUS },
  { label: '短休息',   duration: BREAK_SHORT },
  { label: '长休息',   duration: BREAK_LONG },
];

let currentMode = 0;
let timeLeft = FOCUS;
let totalTime = FOCUS;
let running = false;
let intervalId = null;
let sessionCount = 0;

const progress   = document.getElementById('progress');
const timeDisplay= document.getElementById('timeDisplay');
const mainBtn    = document.getElementById('mainBtn');
const resetBtn   = document.getElementById('resetBtn');
const modeBtn    = document.getElementById('modeBtn');
const modeLabel  = document.getElementById('modeLabel');
const dots       = document.querySelectorAll('.dot');

progress.style.strokeDasharray = CIRCUMFERENCE;

function fmt(sec) {
  const m = String(Math.floor(sec / 60)).padStart(2, '0');
  const s = String(sec % 60).padStart(2, '0');
  return `${m}:${s}`;
}

function render() {
  timeDisplay.textContent = fmt(timeLeft);
  const offset = CIRCUMFERENCE * (1 - timeLeft / totalTime);
  progress.style.strokeDashoffset = offset;
  // title
  document.title = running ? `${fmt(timeLeft)} · 番茄钟` : '番茄钟 · 待办清单';
}

function updateDots() {
  dots.forEach((d, i) => d.classList.toggle('filled', i < sessionCount));
}

function playAlarm() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const notes = [523.25, 659.25, 783.99, 1046.5];
    notes.forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.3, ctx.currentTime + i * 0.18);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.18 + 0.4);
      osc.connect(gain).connect(ctx.destination);
      osc.start(ctx.currentTime + i * 0.18);
      osc.stop(ctx.currentTime + i * 0.18 + 0.4);
    });
    setTimeout(() => ctx.close(), 2500);
  } catch(e) {}
}

function tick() {
  if (timeLeft <= 0) {
    clearInterval(intervalId);
    running = false;
    playAlarm();
    if (currentMode === 0) sessionCount++;
    updateDots();
    mainBtn.textContent = '开始';
    // auto switch after 2s
    setTimeout(() => {
      if (currentMode === 0 && sessionCount % 4 === 0) switchMode(2);
      else if (currentMode === 0) switchMode(1);
      else switchMode(0);
    }, 2000);
    return;
  }
  timeLeft--;
  render();
}

function start() {
  if (running) {
    clearInterval(intervalId);
    running = false;
    mainBtn.textContent = '继续';
    return;
  }
  if (timeLeft <= 0) return;
  running = true;
  mainBtn.textContent = '暂停';
  intervalId = setInterval(tick, 1000);
  render();
}

function reset() {
  clearInterval(intervalId);
  running = false;
  timeLeft = totalTime;
  mainBtn.textContent = '开始';
  render();
}

function switchMode(idx) {
  clearInterval(intervalId);
  running = false;
  currentMode = idx;
  totalTime = MODES[idx].duration;
  timeLeft = totalTime;
  modeLabel.textContent = MODES[idx].label;
  mainBtn.textContent = '开始';
  render();
}

mainBtn.addEventListener('click', start);
resetBtn.addEventListener('click', reset);
modeBtn.addEventListener('click', () => {
  const next = (currentMode + 1) % MODES.length;
  switchMode(next);
});
render();

/* ── Todo ── */
const todoInput = document.getElementById('todoInput');
const addBtn    = document.getElementById('addBtn');
const todoList  = document.getElementById('todoList');
const emptyState= document.getElementById('emptyState');

let todos = JSON.parse(localStorage.getItem('pomo-todos') || '[]');

function saveTodos() {
  localStorage.setItem('pomo-todos', JSON.stringify(todos));
}

function renderTodos() {
  todoList.innerHTML = '';
  emptyState.style.display = todos.length ? 'none' : 'block';
  todos.forEach((todo, i) => {
    const li = document.createElement('li');
    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.className = 'checkbox';
    cb.checked = todo.done;
    cb.addEventListener('change', () => {
      todos[i].done = cb.checked;
      saveTodos();
      renderTodos();
    });
    const span = document.createElement('span');
    span.className = 'task-text' + (todo.done ? ' done' : '');
    span.textContent = todo.text;
    const del = document.createElement('button');
    del.className = 'del-btn';
    del.innerHTML = '✕';
    del.title = '删除';
    del.addEventListener('click', () => {
      todos.splice(i, 1);
      saveTodos();
      renderTodos();
    });
    li.append(cb, span, del);
    todoList.appendChild(li);
  });
}

function addTodo() {
  const text = todoInput.value.trim();
  if (!text) return;
  todos.push({ text, done: false });
  saveTodos();
  renderTodos();
  todoInput.value = '';
  todoInput.focus();
}

addBtn.addEventListener('click', addTodo);
todoInput.addEventListener('keydown', e => { if (e.key === 'Enter') addTodo(); });

renderTodos();
</script>
</body>
</html>
