<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>家庭任务清单</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f0f4f8;--card:#fff;--primary:#4f6ef7;--primary-light:#eef1ff;
  --success:#22c55e;--success-light:#f0fdf4;--text:#1e293b;--muted:#64748b;
  --border:#e2e8f0;--shadow:0 2px 8px rgba(0,0,0,.08);
  --mom:#e91e8c;--dad:#0ea5e9;--kid:#f59e0b;
  --radius:12px;--radius-sm:8px;
}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;overflow-x:hidden}
body{display:flex;flex-direction:column;padding:12px 12px 36px;max-width:480px;margin:0 auto}

header{text-align:center;margin-bottom:12px;flex-shrink:0}
header h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px}
header p{font-size:12px;color:var(--muted);margin-top:2px}

.summary{display:flex;gap:8px;margin-bottom:12px;flex-shrink:0}
.summary-card{flex:1;background:var(--card);border-radius:var(--radius-sm);padding:10px 12px;box-shadow:var(--shadow);text-align:center}
.summary-card .label{font-size:11px;color:var(--muted);margin-bottom:4px}
.summary-card .value{font-size:20px;font-weight:700;color:var(--primary)}
.summary-card .value span{font-size:12px;font-weight:400;color:var(--muted)}

.tabs{display:flex;gap:0;border-radius:var(--radius-sm);overflow:hidden;border:1px solid var(--border);background:var(--card);box-shadow:var(--shadow);margin-bottom:12px;flex-shrink:0}
.tab{flex:1;padding:8px 0;text-align:center;font-size:13px;font-weight:500;color:var(--muted);cursor:pointer;transition:all .2s;border:none;background:none;outline:none}
.tab.active{background:var(--primary);color:#fff}

.members{display:flex;gap:8px;margin-bottom:10px;flex-shrink:0}
.member-badge{flex:1;display:flex;align-items:center;gap:6px;padding:8px 10px;background:var(--card);border-radius:var(--radius-sm);box-shadow:var(--shadow);cursor:pointer;transition:all .2s;border:2px solid transparent}
.member-badge.active{border-color:var(--primary)}
.member-avatar{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff;flex-shrink:0}
.member-info{flex:1;min-width:0}
.member-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.member-progress{font-size:11px;color:var(--muted)}
.member-ring{position:relative;width:28px;height:28px;flex-shrink:0}
.member-ring svg{transform:rotate(-90deg)}
.member-ring .ring-text{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:var(--muted)}
@media (max-width:420px){.members{flex-wrap:wrap}.member-badge{flex:1 1 40%}}

.task-list{flex:1;overflow-y:auto;scroll-behavior:smooth;-webkit-overflow-scrolling:touch;padding-bottom:4px}
.task-list::-webkit-scrollbar{width:4px}
.task-list::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

.group-label{font-size:12px;font-weight:600;color:var(--muted);padding:8px 0 6px;display:flex;align-items:center;gap:6px;position:sticky;top:0;background:var(--bg);z-index:1}
.group-label .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}

.task-card{background:var(--card);border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:6px;box-shadow:var(--shadow);display:flex;align-items:center;gap:10px;cursor:pointer;transition:all .15s;user-select:none;-webkit-tap-highlight-color:transparent;border:1px solid transparent}
.task-card:active{transform:scale(.98)}
.task-card.done{background:var(--success-light);border-color:#bbf7d0}
.task-card.done .task-name{text-decoration:line-through;color:var(--muted)}

.checkbox{width:22px;height:22px;border-radius:50%;border:2px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .2s}
.task-card.done .checkbox{background:var(--success);border-color:var(--success)}
.checkbox svg{width:12px;height:12px;opacity:0;transition:opacity .15s}
.task-card.done .checkbox svg{opacity:1}

.task-body{flex:1;min-width:0}
.task-name{font-size:13px;font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.task-meta{font-size:11px;color:var(--muted);margin-top:1px;display:flex;align-items:center;gap:6px}
.freq-tag{display:inline-block;padding:1px 6px;border-radius:4px;font-size:10px;font-weight:600}
.freq-daily{background:#fef3c7;color:#92400e}
.freq-weekly{background:#dbeafe;color:#1e40af}
.freq-monthly{background:#fce7f3;color:#9d174d}
.person-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}

.progress-section{margin-top:12px;flex-shrink:0}
.progress-title{font-size:12px;font-weight:600;color:var(--muted);margin-bottom:8px}
.progress-row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.progress-person{width:40px;font-size:12px;font-weight:500;color:var(--muted);flex-shrink:0}
.progress-bar-bg{flex:1;height:6px;background:var(--border);border-radius:3px;overflow:hidden}
.progress-bar{height:100%;border-radius:3px;transition:width .3s ease}
.progress-pct{font-size:11px;color:var(--muted);width:36px;text-align:right;flex-shrink:0}

footer{margin-top:auto;padding-top:12px;text-align:center;font-size:10px;color:var(--muted);flex-shrink:0}

.empty-state{text-align:center;padding:40px 20px;color:var(--muted);font-size:13px}
</style>
</head>
<body>

<header>
  <h1>🏠 家庭任务清单</h1>
  <p>把家务变得看得见，全家一起完成</p>
</header>

<div class="summary">
  <div class="summary-card">
    <div class="label">今日</div>
    <div class="value" id="summary-daily">0/0</div>
  </div>
  <div class="summary-card">
    <div class="label">本周</div>
    <div class="value" id="summary-weekly">0/0</div>
  </div>
  <div class="summary-card">
    <div class="label">本月</div>
    <div class="value" id="summary-monthly">0/0</div>
  </div>
</div>

<div class="tabs">
  <button class="tab active" data-view="person" onclick="switchView('person')">按人查看</button>
  <button class="tab" data-view="freq" onclick="switchView('freq')">按频次查看</button>
</div>

<div class="members" id="members-bar"></div>

<div class="task-list" id="task-list"></div>

<div class="progress-section">
  <div class="progress-title">完成情况</div>
  <div id="progress-bars"></div>
</div>

<footer>demo 由 agnes-2.5-flash 生成 · 2026-09-29</footer>

<script>
const MEMBERS = [
  { id: 'mom', name: '妈妈', color: '#e91e8c', light: '#fdf2f8' },
  { id: 'dad', name: '爸爸', color: '#0ea5e9', light: '#f0f9ff' },
  { id: 'kid', name: '小明', color: '#f59e0b', light: '#fffbeb' }
];

const TASKS = [
  { id:1,  name:'倒垃圾',         member:'mom', freq:'daily',   icon:'🗑️' },
  { id:2,  name:'洗碗',           member:'dad', freq:'daily',   icon:'🍽️' },
  { id:3,  name:'喂猫',           member:'kid', freq:'daily',   icon:'🐱' },
  { id:4,  name:'整理书桌',       member:'kid', freq:'daily',   icon:'📚' },
  { id:5,  name:'浇花',           member:'mom', freq:'daily',   icon:'🌿' },
  { id:6,  name:'叠被子',         member:'dad', freq:'daily',   icon:'🛏️' },
  { id:7,  name:'晾衣服',         member:'mom', freq:'daily',   icon:'👕' },
  { id:8,  name:'擦餐桌',         member:'dad', freq:'daily',   icon:'🧹' },
  { id:9,  name:'换床单',         member:'mom', freq:'weekly',  icon:'🛏️' },
  { id:10, name:'大扫除',         member:'dad', freq:'weekly',  icon:'🧽' },
  { id:11, name:'超市采购',       member:'kid', freq:'weekly',  icon:'🛒' },
  { id:12, name:'拖地',           member:'mom', freq:'weekly',  icon:'🧎' },
  { id:13, name:'整理衣柜',       member:'dad', freq:'weekly',  icon:'👔' },
  { id:14, name:'清洗地毯',       member:'kid', freq:'weekly',  icon:'🟫' },
  { id:15, name:'缴水电费',       member:'mom', freq:'monthly', icon:'💡' },
  { id:16, name:'深度清洁卫生间', member:'dad', freq:'monthly', icon:'🚿' },
  { id:17, name:'药箱盘点',       member:'kid', freq:'monthly', icon:'💊' },
  { id:18, name:'更换灯泡',       member:'dad', freq:'monthly', icon:'💡' },
  { id:19, name:'清点米面粮油',   member:'mom', freq:'monthly', icon:'🌾' },
  { id:20, name:'检查灭火器',     member:'kid', freq:'monthly', icon:'🧯' }
];

const FREQ_LABEL = { daily:'每日', weekly:'每周', monthly:'每月' };
const FREQ_CLASS = { daily:'freq-daily', weekly:'freq-weekly', monthly:'freq-monthly' };

let state = {
  tasks: TASKS.map(t => ({ ...t, done: false })),
  view: 'person',
  activeMember: null
};

function getMember(id) { return MEMBERS.find(m => m.id === id); }

function countByFreq(freq) {
  const list = state.tasks.filter(t => t.freq === freq);
  return { total: list.length, done: list.filter(t => t.done).length };
}

function countByMember(memberId) {
  const list = state.tasks.filter(t => t.member === memberId);
  return { total: list.length, done: list.filter(t => t.done).length };
}

function toggleTask(id) {
  const t = state.tasks.find(t => t.id === id);
  if (t) t.done = !t.done;
  render();
}

function switchView(view) {
  state.view = view;
  state.activeMember = null;
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.view === view));
  renderMembers();
  renderTasks();
  renderSummary();
  renderProgress();
}

function selectMember(memberId) {
  state.activeMember = state.activeMember === memberId ? null : memberId;
  renderMembers();
  renderTasks();
}

function renderSummary() {
  ['daily','weekly','monthly'].forEach(freq => {
    const { total, done } = countByFreq(freq);
    const el = document.getElementById('summary-' + freq);
    el.innerHTML = done + '<span>/' + total + '</span>';
  });
}

function renderMembers() {
  const bar = document.getElementById('members-bar');
  if (state.view !== 'person') { bar.innerHTML = ''; return; }
  bar.innerHTML = MEMBERS.map(m => {
    const { total, done } = countByMember(m.id);
    const pct = total ? Math.round(done / total * 100) : 0;
    const active = state.activeMember === m.id;
    const r = 12, circ = 2 * Math.PI * r;
    const offset = circ * (1 - pct / 100);
    return `<div class="member-badge ${active ? 'active' : ''}" onclick="selectMember('${m.id}')" style="${active ? 'background:'+m.light:''}">
      <div class="member-avatar" style="background:${m.color}">${m.name[0]}</div>
      <div class="member-info">
        <div class="member-name">${m.name}</div>
        <div class="member-progress">${done}/${total} 已完成</div>
      </div>
      <div class="member-ring">
        <svg width="28" height="28" viewBox="0 0 28 28">
          <circle cx="14" cy="14" r="${r}" fill="none" stroke="var(--border)" stroke-width="3"/>
          <circle cx="14" cy="14" r="${r}" fill="none" stroke="${m.color}" stroke-width="3"
            stroke-dasharray="${circ}" stroke-dashoffset="${offset}" stroke-linecap="round"
            style="transition:stroke-dashoffset .3s ease"/>
        </svg>
        <div class="ring-text">${pct}%</div>
      </div>
    </div>`;
  }).join('');
}

function renderTasks() {
  const list = document.getElementById('task-list');
  let html = '';

  if (state.view === 'person') {
    const members = state.activeMember ? [state.activeMember] : MEMBERS.map(m => m.id);
    members.forEach(mid => {
      const m = getMember(mid);
      const tasks = state.tasks.filter(t => t.member === mid);
      const { total, done } = countByMember(mid);
      html += `<div class="group-label" style="color:${m.color}">
        <span class="dot" style="background:${m.color}"></span>
        ${m.name} <span style="color:var(--muted);font-weight:400;font-size:11px">${done}/${total}</span>
      </div>`;
      tasks.forEach(t => {
        html += buildCard(t, m);
      });
    });
  } else {
    ['daily','weekly','monthly'].forEach(freq => {
      const tasks = state.tasks.filter(t => t.freq === freq);
      const { total, done } = countByFreq(freq);
      const colors = { daily:'#f59e0b', weekly:'#3b82f6', monthly:'#8b5cf6' };
      html += `<div class="group-label">
        <span class="dot" style="background:${colors[freq]}"></span>
        ${FREQ_LABEL[freq]} <span style="color:var(--muted);font-weight:400;font-size:11px">${done}/${total}</span>
      </div>`;
      tasks.forEach(t => {
        const m = getMember(t.member);
        html += buildCard(t, m);
      });
    });
  }
  list.innerHTML = html || '<div class="empty-state">暂无任务</div>';
}

function buildCard(t, m) {
  const cls = t.done ? 'task-card done' : 'task-card';
  return `<div class="${cls}" onclick="toggleTask(${t.id})">
    <div class="checkbox">
      <svg viewBox="0 0 12 12" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="2 6 5 9 10 3"/>
      </svg>
    </div>
    <div class="task-body">
      <div class="task-name">${t.icon} ${t.name}</div>
      <div class="task-meta">
        <span class="person-dot" style="background:${m.color}"></span>
        <span>${m.name}</span>
        <span class="freq-tag ${FREQ_CLASS[t.freq]}">${FREQ_LABEL[t.freq]}</span>
      </div>
    </div>
  </div>`;
}

function renderProgress() {
  const el = document.getElementById('progress-bars');
  el.innerHTML = MEMBERS.map(m => {
    const { total, done } = countByMember(m.id);
    const pct = total ? Math.round(done / total * 100) : 0;
    return `<div class="progress-row">
      <div class="progress-person" style="color:${m.color}">${m.name}</div>
      <div class="progress-bar-bg">
        <div class="progress-bar" style="width:${pct}%;background:${m.color}"></div>
      </div>
      <div class="progress-pct">${done}/${total}</div>
    </div>`;
  }).join('');
}

function render() {
  renderSummary();
  renderMembers();
  renderTasks();
  renderProgress();
}

render();
</script>
</body>
</html>
